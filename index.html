<section id="home" class="v on"><div class="card hero"><p>崑山科大｜AI 題庫測驗</p><h1>三科考古題刷題 App</h1><p class="muted">選擇科目後，系統會從該科完整題庫隨機抽出 50 題。每題 2 分，滿分 100 分；交卷後可查看成績與逐題檢討。</p><div class="sub"><button class="sb" data-s="genai_level_a"><span>生成式 AI 甲級</span><small>題庫 300 題｜每次隨機抽 50 題</small></button><button class="sb" data-s="genai_level_b"><span>生成式人工智慧乙級</span><small>題庫 150 題｜每次隨機抽 50 題</small></button><button class="sb" data-s="ai_level_b"><span>人工智慧乙級</span><small>題庫 219 題｜每次隨機抽 50 題（原 PDF 標示 220 題）</small></button></div><div class="note">人工智慧乙級原題庫在第 121 題後直接跳至第 123 題，來源缺少第 122 題；本 App 依原題庫實際內容收錄 219 題，不自行補題。</div></div></section>

</main><script>const B={"genai_level_a":{"n":"生成式 AI 甲級","c":300,"s":[""],"q":[[1,0,"生成式人工智慧的定義是什麼？",[["A","一種僅分析現有數據的技術","1"],["B","一 種能從訓練資料生成新內容的技術","2"],["C","一種僅用於數據分類的技術","3"],["D","一種完 全依賴標籤數據集的技術。","4"]],"2",null,"考點：把題幹的關鍵功能、定義或應用情境對應到正確概念。 依題庫答案，正解是 B「一 種能從訓練資料生成新內容的技術」。 生成式 AI 的關鍵不只是分析既有資料，而是從訓練資料學到分布與模式後，產生新的文字、影像、聲音或其他內容。 易混淆：先抓題幹關鍵詞，再比較選項的實際用途與處理對象，不要只因名詞熟悉就作答。","ai_teaching_v1"],[2,0,"生成式人工智慧與傳統人工智慧的主要區別是什麼？",[["A","生成式人工智 慧僅用於文本生成","1"],["B","生成式人工智慧能生成新內容，而傳統人工智慧主要用 於數據分析","2"],["C","傳統人工智慧依賴無監督學習","3"],["D","生成式人工智慧無法應用於 圖像生成。","4"]],"2",null,"考點：把題幹的關鍵功能、定義或應用情境對應到正確概念。 依題庫答案，正解是 B「生成式人工智慧能生成新內容，而傳統人工智慧主要用 於數據分析」。 生成式 AI 會從訓練資料學到模式後產生新內容；傳統 AI 更多用於分類、預測、分析與決策等任務。 易混淆：先抓題幹關鍵詞，再比較選項的實際用途與處理對象，不要只因名詞熟悉就作答。","ai_teaching_v1"],[3,0,"以下哪一項是生成式人工智慧的應用範疇？",[["A","Text-to-Science","1"],["B","Image-to-Science","2"],["C","Audio-to-Text","3"],["D","Data-to-Model。","4"]],"1",null,"考點：把題幹的關鍵功能、定義或應用情境對應到正確概念。 依題庫答案，正解是 A「Text-to-Science」。 依本題庫的分類，Text-to-Science 被視為生成式 AI 的一種應用方向；作答時要依題庫所採用的應用分類，而不是自行改寫類別名稱。 易混淆：先抓題幹關鍵詞，再比較選項的實際用途與處理對象，不要只因名詞熟悉就作答。","ai_teaching_v1"],[4,0,"哪種生成式人工智慧技術專注於生成文字內容？",[["A","VAE","1"],["B","GAN","2"],["C","GPT","3"],["D","CNN。","4"]],"3",null,"考點：把題幹的關鍵功能、定義或應用情境對應到正確概念。 依題庫答案，正解是 C「GPT」。 GPT 屬於生成式預訓練 Transformer，主要依上下文預測後續內容，因此特別適合文字生成與對話。 易混淆：先抓題幹關鍵詞，再比較選項的實際用途與處理對象，不要只因名詞熟悉就作答。","ai_teaching_v1"],[5,0,"生成式人工智慧的主要應用領域不包括以下哪一項？",[["A","Text-to-Text","1"],["B","Text-to-Image","2"],["C","Text-to-Audio","3"],["D","Text-to-Emotion。","4"]],"4",null,"考點：這是一題例外／錯誤辨識題，先確認題幹中的否定條件。 依題庫答案，正解是 D「Text-to-Emotion。」。 Text-to-Emotion 不是題庫列出的標準生成應用分類；常見分類會以輸入與輸出模態命名，例如 Text-to-Text、Text-to-Image 或 Text-to-Audio。 易混淆：其他選項可能都與主題相關，但本題要找的是不符合定義、用途或情境的那一個。","ai_teaching_v1"],[6,0,"生成式人工智慧模型的輸出特徵是什麼？",[["A","可複製的","1"],["B","不可複製的","2"],["C","簡單的","3"],["D","單一的。","4"]],"2",null,"考點：把題幹的關鍵功能、定義或應用情境對應到正確概念。 依題庫答案，正解是 B「不可複製的」。 生成式模型常帶有取樣隨機性，同一提示不一定每次得到完全相同結果，因此題庫把輸出特徵描述為『不可複製』。 易混淆：先抓題幹關鍵詞，再比較選項的實際用途與處理對象，不要只因名詞熟悉就作答。","ai_teaching_v1"],[7,0,"生成式人工智慧技術的
