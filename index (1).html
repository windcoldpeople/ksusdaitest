"],[5,0,"圖靈測試（Turing Test）的主要目的是什麼？",[["A","測試機器的運算速度是否超越人類","1"],["B","評估機器是否能夠像人類一樣進行智能對話","2"],["C","檢測 AI 是否能夠學習新的技能","3"],["D","確認機器是否具有自我意識","4"]],"2",null,"題庫答案為評估機器是否能像人類一樣進行智能對話。圖靈測試著重於對話中的外在表現，而不是比較運算速度，也不等同於證明機器具有自我意識。","ai_draft"],[6,0,"在圖靈測試中，測試者（人類）如何判斷對話對象是否是AI？",[["A","透過機器執行的計算能力進行判斷","1"],["B","根據對話內容與語言理解能力判斷","2"],["C","透過AI執行視覺識別任務來判斷","3"],["D","依據機器是否能夠進行物理操作判斷","4"]],"2",null,"圖靈測試的核心是讓測試者根據文字或對話互動來判斷對方是否為機器，因此題庫答案是根據對話內容與語言理解表現判斷。","ai_draft"],[7,0,"機器學習（Machine Learning）與人工智慧（Artificial Intelligence，AI）之間的關係是什麼？",[["A","機器學習是人工智慧的子領域，透過數據學習模式來提高AI的能力","1"],["B","機器學習與人工智慧無關，機器學習主要用於物理計算","2"],["C","機器學習是一種更高階的技術，AI只是機器學習的一部分","3"],["D","機器學習僅適用於遊戲開發，與AI的其他應用無關","4"]],"1",null,"題庫答案指出機器學習是人工智慧的子領域。AI 是較廣泛的概念，而機器學習是其中一種讓系統從資料中學習模式的方法。","ai_draft"],[8,0,"深度學習（Deep Learning）與類神經網路（Artificial Neural Network，ANN）之間的關係是什麼？",[["A","深度學習是類神經網路的進階版，擁有多層神經元並能處理更複雜的數據","1"],["B","深度學習與類神經網路無關，它們使用不同的數學模型","2"],["C","類神經網路是一種機器學習演算法，但無法應用於 AI","3"],["D","深度學習比類神經網路更簡單，因此適用於小型數據集","4"]],"1",null,"題庫答案為選項 1。深度學習通常使用具有多個處理層的神經網路來學習較複雜的特徵，因此可視為神經網路方法中的進一步發展。","ai_draft"],[9,0,"以下哪個選項正確地描述了人工智慧（Artificial Intelligence，AI） 、機器學習（Machine Learning，ML） 、類神經網路（Artificial Neural Network，ANN）與深度學習（Deep Learning）的層級關係？",[["A","機器學習（ML）比 AI 更廣泛，包含 AI、ANN 和 DL","1"],["B","深度學習（DL）是獨立於 AI、ML 和 ANN 的一種技術","2"],["C","人工智慧（AI）與機器學習（ML）是平行技術，彼此沒有直接關聯","3"],["D","人工智慧（AI）包含機器學習（ML） ，機器學習包含類神經網路（ANN） ，類 神經網路包含深度學習（DL）","4"]],"4",null,"依題庫的分類方式，AI 是最廣的概念，機器學習屬於 AI，類神經網路是機器學習方法之一，而深度學習使用更深層的神經網路，因此答案為選項 4。","ai_draft"],[10,0,"機器學習（Machine Learning）的主要目標是什麼？",[["A","讓機器依靠固定規則進行運算","1"],["B","透過數據學習模式，使機器能夠自主決策與預測","2"],["C","讓機器模仿人類的行為並進行物理運動","3"],["D","設計能夠高速運行的計算機硬體","4"]],"2",null,"題庫答案為選項 2。機器學習的重點是讓系統從資料中找出模式，並利用學到的模式進行分類、預測或決策，而不是只依賴人工寫死的固定規則。","ai_draft"],[11,0,"以下哪一種學習方式不需要標註數據，而是透過發掘數據的內在模式來進行學習？",[["A","監督式學習（Supervised Learning）","1"],["B","非監督式學習（Unsupervised Learning）","2"],["C","強化學習（Reinforcement Learning）","3"],["D","遷移學習（Transfer Learning）","4"]],"2",null,null,null],[12,0,"以下哪個應用最適合使用「非監督式機器學習（Unsupervised Learning） 」？",[["A","醫學影像診斷（Medical Image Diagnosis）","1"],["B","語音辨識（Speech Recognition）","2"],["C","客戶市場區隔（Customer Segmentation）","3"],["D","圖片標註（Image Labeling）","4"]],"3",null,null,null],[13,0,"以下哪一項應用最常使用「監督式學習」技術？",[["A","透過深度強化學習來訓練遊戲 AI","1"],["B","透過 K-Means 演算法進行市場客群分類","2"],["C","訓練一個電子郵件分類器來區分垃圾郵件與正常郵件","3"],["D","透過降維技術（如 PCA）來簡化高維數據","4"]],"3",null,null,null],[14,0,"監督式學習（Supervised Learning）與非監督式學習（Unsupervised Learning）的主要差異是什麼？",[["A","監督式學習使用已標註數據來訓練模型，而非監督式學習不需要標註數據","1"],["B","非監督式學習比監督式學習更容易訓練，且通常不需要大量數據","2"],["C","監督式學習僅適用於分類問題，而非監督式學習僅適用於回歸問題","3"],["D","非監督式學習需要標註數據，而監督式學習不需要","4"]],"1",null,null,null],[15,0,"哪種機器學習模型最適合用來進行語音識別和時間序列預測？",[["A","卷積神經網絡（CNN，Convolutional Neural Networks）","1"],["B","隨機森林（Random Forests）","2"],["C","遞歸神經網絡（RNN，Recurrent Neural Networks）","3"],["D","K-均值聚類（K-Means Clustering）","4"]],"3",null,null,null],[16,0,"未來機器學習的發展可能朝向哪些方向發展？",[["A","自我監督學習，減少對標註數據的依賴","1"],["B","完全拋棄深度學習，回到基於規則的AI","2"],["C","限制 AI 計算能力，以避免其學習新知識","3"],["D","主要應用於電腦硬體設計，無法影響其他領域","4"]],"1",null,null,null],[17,0,"在類神經網路（ANN，Artificial Neural Network）中，隱藏層（Hidden Layer）的主要功能是什麼？",[["A","直接產生最終輸出結果","1"],["B","只負責存儲數據，沒有計算功能","2"],["C","透過權重與激勵函數學習數據特徵","3"],["D","直接將輸入數據傳遞到輸出層，無需處理","4"]],"3",null,null,null],[18,0,"類神經網路透過哪種技術來調整權重，以降低預測誤差？",[["A","隨機森林（Random Forest）","1"],["B","反向傳播（Backpropagation）","2"],["C","K-均值聚類（K-Means Clustering）","3"],["D","主成分分析（PCA）","4"]],"2",null,null,null],[19,0,"以下哪一項應用最常使用卷積神經網路（CNN，Convolutional Neural Network）？",[["A","自然語言處理（NLP）","1"],["B","圖像辨識（Image Recognition）","2"],["C","股票市場預測（Stock Market Prediction）","3"],["D","機器翻譯（Machine Translation）","4"]],"2",null,null,null],[20,0,"類神經網路的未來發展可能朝向哪些方向？",[["A","強化模型可解釋性，使AI決策更透明","1"],["B","降低計算需求，發展低功耗AI","2"],["C","與符號推理（Symbolic AI）結合，提高AI的推理能力","3"],["D","以上皆是","4"]],"4",null,null,null],[21,0,"深度學習（Deep Learning）與傳統機器學習（Machine Learning）的主要區別是什麼？",[["A","深度學習能夠自動學習特徵，而機器學習通常需要人工特徵設計","1"],["B","機器學習比深度學習更擅長處 即時反應，適合部署於終端設備；NPU則提供大規模雲端訓練效能，支援複雜模型運算","2"],["C","TPU為Google雲端資料中心設計，用於高效訓練與推論大型模型；NPU則專為邊緣裝置設計，強調低功耗與即時推論","3"],["D","TPU與NPU都屬於GPU的次分類，加速原理與應用完全相同，主要區別僅在品牌命名","4"]],"3",null,null,null],[126,3,"在AI應用中，GPU（Graphics Processing Unit）與NPU（Neural-network Processing Unit）均可執行神經網路相關運算。以下哪一項最能正確比較兩者的設計方向與使用情境？",[["A","GPU專為低功耗推論任務設計，常用於手機等邊緣裝置；NPU則為高效能矩陣訓練設計，主要部署於雲端資料中心","1"],["B","GPU為通用加速器，可處理深度學習訓練與推論；NPU則為專門針對推論任務設計的低功耗處理器，常見於終端裝置","2"],["C","GPU與NPU僅在製程技術不同，運算架構與功能完全相同，皆以浮點精度為主","3"],["D","NPU通常搭載於桌上型電腦中取代GPU，並支援複雜圖形渲染與遊戲加速","4"]],"2",null,null,null],[127,3,"為什麼GPU（Graphics Processing Unit）特別適合用於深度學習模型的訓練？",[["A","GPU 擅長處理邏輯與條件跳躍指令","1"],["B","GPU 具有大量的並行運算核心，適合矩陣計算","2"],["C","GPU 的主記憶體容量遠大於CPU（Central Processing Unit）","3"],["D","GPU 使用固定電路執行每一層神經網路","4"]],"2",null,null,null],[128,3,"哪一種處理器專門為訓練與執行深度神經網路中的矩陣運算所設計，並由Google 發展與部署？",[["A","GPU（Graphics Processing Unit）","1"],["B","NPU（Neural-network Processing Unit）","2"],["C","CPU（Central Processing Unit）","3"],["D","TPU（Tensor Processing Unit）","4"]],"4",null,null,null],[129,3,"若需在智慧手機中即時進行影像辨識、語音推論等AI任務，最適合採用哪種處理器？",[["A","GPU（Graphics Processing Unit）","1"],["B","NPU（Neural-network Processing Unit）","2"],["C","CPU（Central Processing Unit）","3"],["D","TPU（Tensor Processing Unit）","4"]],"2",null,null,null],[130,3,"以下哪一項不是NPU（Neural-network Processing Unit）的主要特點？",[["A","低功耗、高能效比","1"],["B","適用於邊緣裝置進行AI推論","2"],["C","支援高度通用的程式執行","3"],["D","專為神經網路結構做硬體優化設計","4"]],"3",null,null,null],[131,3,"若一家公司希望進行大規模AI模型訓練（如GPT） ，在硬體選擇上最合適的是哪一種？",[["A","NPU（Neural-network Processing Unit）","1"],["B","CPU（Central Processing Unit）","2"],["C","GPU（Graphics Processing Unit）","3"],["D","Edge TPU（Tensor Processing Unit）","4"]],"3",null,null,null],[132,3,"在訓練現代大型深度學習模型（例如：GPT）時，對記憶體的需求非常高。以下哪一項最能正確描述模型訓練階段對記憶體的實際需求與特性？",[["A","深度學習模型訓練主要依賴快取記憶體（Cache） ，通常不需超過1GB記憶體即可完成訓練","1"],["B","單張GPU的記憶體通常可提供數百GB空間，因此可以輕鬆訓練所有類型的模型","2"],["C","模型訓練過程中需儲存中間特徵圖、梯度與權重等資料，常需數十至數百 GB記憶體，並依靠多張GPU協同處理","3"],["D","模型訓練對記憶體要求極低，因為所有資料都儲存在SSD（Solid State Drive）中，只需少量快取記憶體即可完成運算","4"]],"3",null,null,null],[133,3,"在訓練超大型深度學習模型時，若單一GPU（Graphics Processing Unit）的記憶體無法容納整個模型或完整訓練批次資料，以下哪一種技術最常被用來解決此類記憶體瓶頸？",[["A","將部分模型儲存在SSD（Solid State Drive）中，以減少記憶體讀寫次數","1"],["B","使用資料壓縮技術，將所有參數轉換為JPEG格式以節省空間","2"],["C","採用模型切分（Model Parallelism）或梯度累積（Gradient Accumulation）等策略分散記憶體負擔","3"],["D","降低GPU時脈頻率，使記憶體壓力降低","4"]],"3",null,null,null],[134,3,"在AI模型訓練與推論的過程中，尤其是使用高效能GPU（Graphics Processing Unit）時，HBM（High Bandwidth Memory）被廣泛應用於記憶體架構中。以下哪一項最正確地比較了HBM與一般DRAM（如DDR或GDDR）在特性與應用上的差異？",[["A","HBM成本低廉、設計簡單，因此常用於手機或IoT裝置中","1"],["B","HBM提供更高的記憶體頻寬，但因封裝複雜與成本較高，主要用於高效能加速器如GPU與AI晶片中","2"],["C","DRAM擁有更高頻寬與能效，因此逐漸取代HBM成為AI訓練的主流記憶體","3"],["D","HBM的延遲極高，不適合用於任何即時運算任務中","4"]],"2",null,null,null],[135,3,"關於AI模型訓練與推論階段所需的硬體資源，以下哪一項描述最為正確？",[["A","模型訓練與推論皆需反向傳播與梯度更新，因此兩者的記憶體與運算需求大致相同","1"],["B","模型訓練強調低功耗與即時反應；推論則著重於高運算效能與多張GPU並行協作","2"],["C","模型訓練通常需要大量浮點運算與高頻寬記憶體支援，推論則傾向低延遲、低功耗，並常在邊緣裝置上進行","3"],["D","推論需頻繁更新模型參數，因此記憶體需求較高，而訓練階段多數計算可離線處理，需求較低","4"]],"3",null,null,null],[136,3,"在訓練現代大型AI模型（例如：GPT）時，能源消耗極為驚人。以下哪一項最能正確解釋其高功耗的主要原因？",[["A","模型訓練需頻繁寫入SSD，儲存裝置能耗高","1"],["B","大型模型參數複雜，需長時間進行密集運算與資料搬移，導致GPU、記憶體與冷卻系統全面高功耗運行","2"],["C","AI模型訓練需在戶外高溫環境中進行，導致運算效能下降、功耗升高","3"],["D","模型推論過程反覆進行，消耗遠高於訓練階段","4"]],"2",null,null,null],[137,3,"AI 訓練時的高能耗伴隨大量熱能產生。以下哪一項為現代資料中心最常見且有效的散熱策略？",[["A","將冷卻液直接導入GPU晶片附近的散熱區域，以提高導熱效率","1"],["B","增加風扇數量與轉速，讓機房內溫度維持常溫即可","2"],["C","將所有訓練任務移轉至白天，減少夜間耗能","3"],["D","使用低功耗 SSD來減輕主機板熱負載","4"]],"1",null,null,null],[138,4,"使用AI生成內容時，以下哪種行為可能涉及智慧財產權侵害？",[["A","使用AI工具生成內容後，自行修改部分內容，即可宣稱為個人原創","1"],["B","AI生成的內容不受智慧財產權保護，因此可自由使用","2"],["C","將AI生成的內容直接用於商業用途，而未確認版權問題","3"],["D","AI工具僅提供建議，因此不涉及智慧財產權問題","4"]],"3",null,null,null],[139,4,"使用AI生成內容時，應特別注意哪些倫理議題？",[["A","只要AI生成的內容符合使用者需求，無需考慮倫理影響","1"],["B","避免生成帶有歧視性、誤導性或仇恨言論的內容","2"],["C","AI生成的內容完全客觀，不需擔心倫理問題","3"],["D","AI生成的內容皆經過嚴格審核，無需擔心倫理爭議","4"]],"2",null,null,null],[140,4,"在使用AI工具時，應如何保護個人資訊安全？",[["A","避免輸入敏感個人資料，如銀行帳號、密碼或身分證號碼","1"],["B","AI工具皆為安全平台，可放心輸入任何個人資訊","2"],["C","只要是收費的AI工具，就不會洩露個人資訊","3"],["D","AI工具無法存取使用者提供的資料，因此無需擔心安全問題","4"]],"1",null,null,null],[141,4,"以下哪項行為可能涉及法律風險？",[["A","使用AI生成的內容來撰寫個人筆記，僅供個人學習","1"],["B","參考AI生成的內容，並加入自己的見解後發表","2"],["C","使用AI來協助整理資料，而非直接使用其輸出的內容","3"],["D","使用AI生成內容，並未經審查就發表為事實性報導","4"]],"4",null,null,null],[142,4,"當 AI生成的內容出現錯誤時，使用者應該怎麼做？",[["A","AI生成的內容都是準確的，無需驗證","1"],["B","驗證AI生成的內容是否正確，而非直接採信","2"],["C","只要AI生成的內容看起來合理，就可以直接使用","3"],["D","AI會自動糾正錯誤內容，因此無需進行確認","4"]],"2",null,null,null],[143,4,"在使用AI工具時，以下哪種行為應當避免？",[["A","嘗試讓AI生成暴力、仇恨言論或非法內容","1"],["B","將AI工具用於學術研究或個人學習用途","2"],["C","使用AI來優化寫作和創意發想","3"],["D","向AI詢問一般常識問題，以獲得參考資訊","4"]],"1",null,null,null],[144,4,"在生成式AI模型（如 GPT、Stable Diffusion等）的未來發展中，以下哪一項被廣泛視為持續進展的重要挑戰？",[["A","模型越大，其運算效能越低，因此需回到傳統機器學習方法","1"],["B","如何在保持創造力的同時，提升模型回應的一致性、真實性與可控性","2"],["C","人工智慧將取代所有軟體工程師，因此不需再發展新模型","3"],["D","生成式 AI 模型訓練成本極低，因此可隨時更新與調整架構","4"]],"2",null,null,null],[145,4,"關於生成式AI對未來產業的影響，以下哪一項敘述最接近專家對其長期趨勢的觀察？",[["A","生成式AI僅能取代重複性勞動，對創意產業毫無影響","1"],["B","生成式AI將使所有產業回到手工時代，以避免機器取代人類","2"],["C","生成式AI可重塑創意與知識工作流程，促進「人機共創」的產業型態","3"],["D","生成式AI僅適用於科技產業，對其他產業的影響極為有限","4"]],"3",null,null,null],[146,4,"AGI（Artificial General Intelligence，通用人工智慧）是指能執行廣泛任務並具備人類般理解與學習能力的AI系統。以下哪一項敘述最接近目前學術界對AGI發展的主流觀點？",[["A","AGI已在2023年實現，目前已能完全取代專業知識工作者","1"],["B","現有生成式AI（例如：GPT）已具備AGI所需的全面推理與自我學習能力","2"],["C","AGI發展仍需長時間技術突破，目前模型多屬狹義人工智慧（Narrow AI）","3"],["D","AGI將不需要資料訓練，因為其運作仰賴直覺式演算法","4"]],"3",null,null,null],[147,4,"以下哪一項最符合目前對生成式AI技術對未來勞動市場影響的主流看法？",[["A","AI的自動化能力將使所有類型工作皆被全面淘汰","1"],["B","生成式AI主要影響體力勞動產業，對知識型工作幾乎無關","2"],["C","勞動市場將面臨職能重組與角色轉換，AI將取代部分任務並創造新型職位","3"],["D","由於AI無法自主決策，因此不會對任何產業造成實質影響","4"]],"3",null,null,null],[148,4,"以下哪一項最能反映生成式AI與永續發展之間的潛在衝突？",[["A","生成式AI模型能主動生成綠色能源，因此對環境有絕對正面效益","1"],["B","訓練大型AI模型需高度能源消耗，對碳排與電力資源造成挑戰","2"],["C","AI模型僅在終端設備上執行，因此其能源影響可忽略不計","3"],["D","生成式AI能自我優化電源使用，因此能實現零碳排訓練流程","4"]],"2",null,null,null],[149,4,"近年來，AI發展趨勢之一是「多模態生成模型」 ，可同時處理文字、圖像、音訊等資料。以下哪一項最能準確描述這類技術的潛在發展方向？",[["A","多模態生成模型僅能處理靜態資料，無法應用於動態影音或語音互動","1"],["B","多模態模型能促進跨領域應用與整合，如智慧助理、虛擬角色、設計輔助等","2"],["C","因為運算需求過高，多模態模型不適合實際應用，只能做為學術展示","3"],["D","多模態生成技術是機器學習的退步趨勢，將回歸單一模態模型為主","4"]],"2",null,null,null],[150,4,"隨著AI技術快速普及，各國教育體系逐步將AI納入核心課程。以下哪一項最能代表此趨勢背後的主要教育目標？",[["A","訓練學生盡快取代人工職位，加速AI接管社會進程","1"],["B","教育學生學會規避AI工具的使用，以降低技術依賴","2"],["C","培養學生具備理解、應用與批判AI的基本素養，強化「AI素養」與倫理判斷力","3"],["D","教學以特定AI模型為主，如ChatGPT操作技巧，無需原理知識","4"]],"3",null,null,null]],"note":null},"ai_level_b":{"n":"人工智慧乙級","c":219,"s":["第一章 AI 基本知識","第二章 人工智慧的應用","第三章機器學習篇","第四章 Python 程式設計","第四章深度學習篇","第五章人工智慧的未來與挑戰"],"q":[[1,0,"人工智慧最基本的模型架構三層，以下哪一個不隸屬模型架構",[["A","輸入層","1"],["B","隱藏層","2"],["C","輸出層","3"],["D","應用層","4"]],"4",null,null,null],[2,0,"請寫出 CNN 全名",[["A","Convolution Neural Network","1"],["B","Create Neural Network","2"],["C","Connect Neural Network","3"],["D","Collaborative Neural Network","4"]],"1",null,null,null],[3,0,"AGI(artificialgeneralintelligence)通用人工智慧又稱為強人工智慧，下列何者 為AGI?",[["A","人臉門禁系統","1"],["B","車牌辨識系統","2"],["C","新一代自動駕駛車","3"],["D","語音助理(Siri)","4"]],"3",null,null,null],[4,0,"人工智慧技術 AI 與三大新興技術跨領域結合，組成人工智慧物聯網，請問 哪一個不隸屬人工智慧物聯網",[["A","邊緣計算(雲計算)(cloud computing)","1"],["B","大數據(big data)","2"],["C","翻譯語言","3"],["D","物 聯網(IoT, Internet of things)","4"]],"3",null,null,null],[5,0,"下列是何者是深度學習?",[["A","DNN","1"],["B","RNN","2"],["C","CNN","3"],["D","以上皆是","4"]],"4",null,null,null],[6,0,"現代所稱的人工智慧其實是由許多計算技術所組成的統稱。下列哪一項不屬 於人工智慧領域中知名的計算技術的一環?",[["A","機器學習","1"],["B","演化計算","2"],["C","資料探勘","3"],["D","雲端運算","4"]],"4",null,null,null],[7,0,"自駕車根據其能力限制有區分許多等級。現在搭載 Hardware-1 的特斯拉 (Tesla)自駕車中，宣稱其可以達到在高速公路上自動駕駛。但是要求駕駛仍需在 旁監看，隨時準備接手，且雙手不得離開方向盤。請問這樣的形式屬於下列哪一 個等級?",[["A","Level1","1"],["B","Level2","2"],["C","Level3","3"],["D","Level4","4"]],"2",null,null,null],[8,0,"機器學習模型中，下列關於模型的偏差（Bias）與變異（Variance）之描述哪 一項正確？",[["A","希望訓練好的模型能是高變異、低偏差","1"],["B","高偏差代表模型過於複雜","2"],["C","高變異代表模型過於簡單","3"],["D","偏差與變異之間存在一平衡（Trade-off）關係","4"]],"4",null,null,null],[9,0,"請問下列何者是為機器學習的工具資源?",[["A","Tensor Flow","1"],["B","PyTorch","2"],["C","Weka","3"],["D","以上皆是","4"]],"4",null,null
