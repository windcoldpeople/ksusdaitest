name: Unpack quiz app

on:
  push:
    paths:
      - '.github/workflows/unpack-app.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app into plain HTML
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const src = fs.readFileSync('index.html', 'utf8');
          const m = src.match(/atob\('([^']+)'\)/);
          if (!m) throw new Error('Compressed quiz payload not found');
          const html = zlib.gunzipSync(Buffer.from(m[1], 'base64')).toString('utf8');
          fs.writeFileSync('index.html', html, 'utf8');
          console.log(`Wrote plain index.html: ${html.length} characters`);
          NODE

      - name: Commit plain HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix browser compatibility: unpack quiz app"
          git push
