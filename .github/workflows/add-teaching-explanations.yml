name: Add teaching explanations

on:
  push:
    paths:
      - '.github/workflows/add-teaching-explanations.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add explanations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          reasons = {}
          for fn in ['tmp/explanations-a.json','tmp/explanations-b.json','tmp/explanations-c.json']:
              part = json.loads(Path(fn).read_text(encoding='utf-8'))
              reasons.update(part)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'const B=(\{.*?\});let st=', s, re.S)
          if not m:
              raise SystemExit('Question bank not found')
          B = json.loads(m.group(1))

          expected = {'genai_level_a':300,'genai_level_b':150,'ai_level_b':219}
          neg_patterns = [
              r'不包括',r'不屬於',r'不是',r'何者為非',r'哪一項為非',
              r'何者不正確',r'哪一項不正確',r'哪個不正確',
              r'何者錯誤',r'哪一項錯誤',r'哪個錯誤',
              r'哪一個項目是錯誤',r'不包含下列',r'無法緩解'
          ]

          for sk, count in expected.items():
              if len(B[sk]['q']) != count or len(reasons[sk]) != count:
                  raise SystemExit(f'Count mismatch: {sk}')
              for q in B[sk]['q']:
                  num = str(q[0])
                  hit = next((o for o in q[3] if o[2] == q[4]), None)
                  if not hit or num not in reasons[sk]:
                      raise SystemExit(f'Missing data: {sk} {num}')
                  letter, answer = hit[0], ' '.join(hit[1].split())
                  question = ' '.join(q[2].split())
                  r = reasons[sk][num]
                  neg = any(re.search(x, question) for x in neg_patterns)
                  if neg:
                      exp = ('考點：這是一題例外／錯誤辨識題，先確認題幹中的否定條件。 '
                             f'依題庫答案，正解是 {letter}「{answer}」。 {r} '
                             '易混淆：其他選項可能都與主題相關，但本題要找的是不符合定義、用途或情境的那一個。')
                  else:
                      exp = ('考點：把題幹的關鍵功能、定義或應用情境對應到正確概念。 '
                             f'依題庫答案，正解是 {letter}「{answer}」。 {r} '
                             '易混淆：先抓題幹關鍵詞，再比較選項的實際用途與處理對象，不要只因名詞熟悉就作答。')
                  q[6] = exp
                  q[7] = 'ai_teaching_v1'

          if sum(len(v['q']) for v in B.values()) != 669:
              raise SystemExit('Total count mismatch')
          if any(not q[6] or q[7] != 'ai_teaching_v1' for v in B.values() for q in v['q']):
              raise SystemExit('Explanation validation failed')

          newB = json.dumps(B, ensure_ascii=False, separators=(',',':'))
          s = s[:m.start(1)] + newB + s[m.end(1):]
          old = 'es.textContent=x[7]==="ai_draft"?"AI 解析草稿｜尚待正式 QA":"答案來源：原 PDF 題庫"'
          new = 'es.textContent=x[7]==="ai_teaching_v1"?"AI 教學解析｜非官方題解；正確答案依原 PDF 題庫":x[7]==="ai_draft"?"AI 解析草稿｜尚待正式 QA":"答案來源：原 PDF 題庫"'
          if old not in s:
              raise SystemExit('Review label marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-teaching-explanations.yml
          git rm tmp/explanations-a.json tmp/explanations-b.json tmp/explanations-c.json
          git add index.html
          git commit -m "Add teaching explanations for all 669 questions"
          git push
